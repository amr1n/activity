<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-3 border-radius-2">
        <h3>Feedback of your experience</h3>
        <form style="width: 30rem;">

        <div class="mb-3">
            <label for="text" class="form-label">Name</label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="XYZ">
        </div>
    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Email address</label>
        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
    </div>
        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">How was your experience?</label>
            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
        </div>
        <select class="form-select" aria-label="Default select example">
            <option selected>Overall experience</option>
            <option value="1">Excellent</option>
            <option value="2">Good</option>
            <option value="3">Bad</option>
        </select>
        <div class="form-check mb-3 mt-3">
            <input class="form-check-input" type="checkbox" value="" id="checkDefault">
            <label class="form-check-label" for="checkDefault">
               I will come again
            </label>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">
                I will not come again
            </label>
        </div>

        <label for="range1" class="form-label">Rate out of 10</label>
        <input type="range" class="form-range" id="range1">
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
